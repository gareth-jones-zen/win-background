[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win-background"
version = "0.2.2"
description = "Running Python tools quietly in the background on Windows: autostart, notifications, single-instance locks, a log."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
